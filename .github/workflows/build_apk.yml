name: 自动构建 Android APK

on:
  workflow_dispatch: # 支持手动点击一键打包
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: 检出源码
        uses: actions/checkout@v4

      # 2. 安装 Java 环境
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. 自动配置 local.properties（设置包名）
      - name: 写入 local.properties
        run: echo "applicationId=com.xinbida.tsdaodao" > local.properties

      # 4. 赋予 Gradle 执行权限
      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      # 5. 执行 Gradle 编译 APK
      - name: 开始编译 APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. 上传生成的 APK 文件供下载
      - name: 上传 APK 文件至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 唐僧叨叨-Android-安装包
          path: app/build/outputs/apk/debug/*.apk
